<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emkay – a voice assistant on the phone or tablet you already have</title>
<meta name="description" content="Emkay turns a phone, tablet, TV or Raspberry Pi into a full OpenVoiceOS voice assistant – open a web page and say “Hey Emkay”. Private by design, works with Home Assistant, nothing to install.">
<meta name="theme-color" content="#05070a">
<meta property="og:title" content="Emkay – a voice assistant on the phone or tablet you already have">
<meta property="og:description" content="A full OpenVoiceOS voice assistant in any browser. Private by design, nothing to install.">
<meta property="og:image" content="https://emkay.ai/emkay.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #05070a; --card: #141b24; --ink: #fff; --muted: #8a96a8; --line: #232c38;
          --accent: #22a7f0; --accent-strong: #1478c8; --soft: #c7d0dc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 0 22px 60px; }

  /* the language picker, top right */
  .top { display: flex; justify-content: flex-end; padding-top: 14px; }
  .top select { background: var(--card); color: var(--soft); border: 1px solid var(--line);
                border-radius: 20px; padding: 6px 12px; font: inherit; font-size: 14px; }

  /* hero: the words on one side, a phone with the face on the other */
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding: 30px 0 24px; }
  h1 { font-weight: 300; letter-spacing: .3em; font-size: 46px; margin: 0; }
  .tag { color: var(--soft); margin: 14px 0 28px; font-size: 21px; line-height: 1.45; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  .open { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
          padding: 15px 34px; border-radius: 40px; font-size: 18px; }
  .open:hover { background: var(--accent-strong); }
  .open.ghost { background: #1b2430; }
  .open.ghost:hover { background: #253142; }
  .note { color: var(--muted); font-size: 14px; margin-top: 16px; }
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; text-align: center; padding-top: 16px; }
    .buttons { justify-content: center; }
    .phone-wrap { order: -1; }
    .phone { width: 190px; }
  }

  /* the phone: a frame, a black screen, the Mark II face (as ovos-visage draws it) */
  .phone-wrap { display: flex; justify-content: center; }
  .phone { width: 250px; filter: drop-shadow(0 30px 50px rgba(0, 0, 0, .6)); }
  .phone .eye { transform-box: fill-box; transform-origin: center; transition: transform .12s ease-out; }
  .phone.blink .eye, .phone .eye.wink { transform: scaleY(.08); }
  .phone.thinking .eye { transform: scaleY(.62); }
  .phone.happy .eye { transform: scale(1.12); }
  .phone .bars rect { transform-box: fill-box; transform-origin: center; animation: bar .9s ease-in-out infinite; }
  .phone .bars rect:nth-child(2n) { animation-delay: -.3s; }
  .phone .bars rect:nth-child(3n) { animation-delay: -.6s; }
  @keyframes bar { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1.6); } }
  .phone .bars, .phone .shield { display: none; }
  .phone.listening .bars { display: inline; }
  .phone.listening .mouth { display: none; }
  .phone.offline .shield { display: inline; }
  .phone .caption { font: 15px system-ui, sans-serif; fill: var(--soft); }
  .phone .caption.said { fill: #fff; }
  @media (prefers-reduced-motion: reduce) { .phone .bars rect { animation: none; } }

  h2 { font-weight: 500; font-size: 24px; margin: 48px 0 12px; }
  .lead { color: var(--soft); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 22px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .cards.two { grid-template-columns: repeat(2, 1fr); }      /* four cards: 2 x 2 */
  .cards.four { grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); }  /* eight: 4 x 2 */
  @media (max-width: 640px) { .cards.two { grid-template-columns: 1fr; } }
  .cards .card { padding: 16px 20px; }
  .cards h3 { margin: 0 0 6px; font-size: 17px; }
  .cards p { margin: 0; color: var(--soft); font-size: 15px; }
  .cards .icon { font-size: 26px; line-height: 1; margin-bottom: 8px; }
  .say { color: #fff; font-style: italic; }
  ol, ul { padding-left: 22px; }
  li { margin: 6px 0; }
  .langs { color: var(--muted); }
  .card.home .open { margin: 4px 0 8px; }
  /* Emkay Capsule: a picture next to the text */
  .card.capsule { display: grid; grid-template-columns: 160px 1fr; gap: 20px; align-items: center; padding: 16px 22px; }
  .card.capsule img { width: 160px; height: auto; border-radius: 12px; display: block; }
  .card.capsule p { margin: 0 0 10px; }
  .card.capsule .open { margin: 4px 0 4px; }
  @media (max-width: 560px) { .card.capsule { grid-template-columns: 1fr; } .card.capsule img { width: 100%; max-width: 260px; margin: 0 auto; } }
  footer { color: var(--muted); font-size: 14px; text-align: center; margin-top: 56px; }
</style>

<script src="texts.js"></script>
<script>
// The page's language: ?lang=, then the one picked before, then the
// browser's; texts.js has every text (TEXTS[lang][key]), English as fallback.
const LANGS = Object.keys(TEXTS);
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("emkay-site-lang"); } catch {}
  for (const want of [q, saved, ...(navigator.languages || [navigator.language])]) {
    if (!want) continue;
    const w = want.toLowerCase();
    const hit = LANGS.find((l) => l.toLowerCase() === w) || LANGS.find((l) => l.split("-")[0] === w.split("-")[0]);
    if (hit) return hit;
  }
  return "en";
}
let lang = pickLang();
const t = (key) => TEXTS[lang][key] ?? TEXTS.en[key];

function render() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelector('meta[name="description"]').content = t("description");
  // texts may hold <b>, <i class="say"> and links: they are ours, from texts.js
  document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = t(el.dataset.t); });
}

const picker = document.getElementById("lang");
for (const l of LANGS) picker.append(new Option(TEXTS[l]._name, l));
picker.value = lang;
picker.onchange = () => {
  lang = picker.value;
  try { localStorage.setItem("emkay-site-lang", lang); } catch {}
  render();
};
render();

// The face on the phone: a little loop of what Emkay does - it rests and
// blinks, hears "Hey Emkay", listens, thinks, answers with a moving mouth,
// smiles and sometimes winks; once in a while it goes offline and shows its
// shield. Plain SVG; nothing loads, nothing is sent.
(() => {
  const phone = document.getElementById("phone");
  const mouth = document.getElementById("mouth");
  const lines = [document.getElementById("caption"), document.getElementById("caption2")];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const SMILE = "M93 262 Q125 284 157 262";
  const BIG_SMILE = "M90 258 Q125 296 160 258";
  const open = (h) => `M97 264 Q125 ${264 + h} 153 264 Q125 ${264 + h * 0.35} 97 264 Z`;
  // a caption in up to two lines of about 26 characters
  const say = (text, cls = "") => {
    const words = text.split(" "), out = [""];
    for (const w of words) {
      if ((out.at(-1) + " " + w).trim().length > 26 && out.length < 2) out.push("");
      out[out.length - 1] = (out.at(-1) + " " + w).trim();
    }
    lines.forEach((el, i) => { el.textContent = out[i] || ""; el.setAttribute("class", "caption " + cls); });
  };
  let offline = false;
  const state = (s) => phone.setAttribute("class", "phone " + s + (offline ? " offline" : ""));

  let blinking = true;
  (async function blink() {   // blinks on its own, every 2.5-6 s
    while (true) {
      await sleep(2500 + Math.random() * 3500);
      if (!blinking) continue;
      phone.classList.add("blink");
      await sleep(140);
      phone.classList.remove("blink");
    }
  })();

  async function talk(text, ms) {
    say(text);
    const end = Date.now() + ms;
    while (Date.now() < end) {
      mouth.setAttribute("d", open(6 + Math.random() * 22));
      await sleep(90 + Math.random() * 70);
    }
    mouth.setAttribute("d", SMILE);
  }

  async function loop() {
    if (still) { say(""); return; }
    for (let i = 0; ; i++) {
      const dialogues = t("dialogues");
      const [q, a, go] = dialogues[i % dialogues.length];
      state(""); say(""); mouth.setAttribute("d", SMILE);
      await sleep(2600);
      state("listening"); say(`“${q}”`, "said");
      await sleep(2600);
      state("thinking"); blinking = false; say("");
      await sleep(900);
      if (go !== undefined) offline = go;   // "go offline" / "go online"
      state(""); blinking = true;
      await talk(a, 2400);
      say("");
      state("happy"); mouth.setAttribute("d", BIG_SMILE);
      await sleep(1100);
      if (i % 2 === 1) {   // a wink, now and then
        document.getElementById("eye-right").classList.add("wink");
        await sleep(260);
        document.getElementById("eye-right").classList.remove("wink");
      }
      state(""); mouth.setAttribute("d", SMILE);
    }
  }
  loop();
})();
</script>
